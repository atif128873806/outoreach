services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: outreach
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bind Next standalone to all interfaces so the in-container healthcheck
      # (127.0.0.1) works; Docker otherwise sets HOSTNAME to the container id.
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgres://outreach:${POSTGRES_PASSWORD}@db:5432/outreach
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (openssl rand -hex 32)}
      # Public URL — used in welcome-email links
      APP_URL: ${APP_URL:-}
      # Free AI for all accounts (global fallback key)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # Instance-wide hard ceiling on included-AI generations/day per user
      # (cost brake; overrides plan limits, including Pro's "unlimited")
      GLOBAL_AI_DAILY_LIMIT: ${GLOBAL_AI_DAILY_LIMIT:-}
      # Public-facing identity shown on legal/pricing pages
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      LEGAL_OPERATOR: ${LEGAL_OPERATOR:-}
      # System (transactional) mailer — welcome emails from the company mailbox
      SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
      SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-465}
      SYSTEM_SMTP_SECURE: ${SYSTEM_SMTP_SECURE:-true}
      SYSTEM_SMTP_USER: ${SYSTEM_SMTP_USER:-}
      SYSTEM_SMTP_PASS: ${SYSTEM_SMTP_PASS:-}
      SYSTEM_FROM_EMAIL: ${SYSTEM_FROM_EMAIL:-}
      SYSTEM_FROM_NAME: ${SYSTEM_FROM_NAME:-Outreach Studio}
      # Skip TLS cert-hostname check (only needed when connecting to mail by IP)
      SYSTEM_SMTP_INSECURE_TLS: ${SYSTEM_SMTP_INSECURE_TLS:-}
      # Close registration once your accounts exist
      SIGNUPS_DISABLED: ${SIGNUPS_DISABLED:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nightly logical backups into ./backups (kept 14 days)
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U outreach -d outreach -Fc -f "/backups/outreach-$$(date +%F).dump" &&
        find /backups -name "outreach-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
